const PAIE = {

  autorises : [

  ],
  /* Les rôles qui donnent aussi accès, lus dans Firestore */
  rolesAutorises : ["dga", "dg"],

  cleApi : "AIzaSyDoWCBh3rschFm97Z5Y7ax1bamhadDS42Q",
  projet : "africa-vision-3b38f"
};
</script>

<div id="porte">

<script>
(function(){
  const CLE_SESSION = "av_session";
  const alerte = document.getElementById("porte-alerte");
  const dire = t => { alerte.textContent = t; alerte.classList.add("visible"); };
  const taire = () => alerte.classList.remove("visible");

  function estAutorise(email, roles){
    const e = String(email || "").toLowerCase();
    if(PAIE.autorises.map(x => String(x).toLowerCase()).indexOf(e) !== -1) return true;
    if(roles && roles.length){
      for(const r of PAIE.rolesAutorises){
        if(roles.indexOf(r) !== -1) return true;
      }
    }
    return false;
  }

  /* Charge l'application, seulement maintenant */
  function ouvrir(){
    document.getElementById("porte").classList.add("ouverte");
    const code = document.getElementById("code-appli").textContent;
    document.getElementById("code-appli").textContent = "";
    (0, eval)(code);
  }

  async function rolesDe(session){
    try{
      const r = await fetch("https://firestore.googleapis.com/v1/projects/" + PAIE.projet
        + "/databases/(default)/documents/utilisateurs/" + session.uid,
        { headers: { Authorization: "Bearer " + session.idToken } });
      if(!r.ok) return [];
      const d = await r.json();
      const f = (d.fields || {}).roles;
      if(f && f.arrayValue && f.arrayValue.values)
        return f.arrayValue.values.map(v => String(v.stringValue || "").toLowerCase());
      return [];
    }catch(e){ return []; }
  }

  async function verifier(session){
    if(!session || !session.idToken || Date.now() >= session.expire) return false;
    return estAutorise(session.email, await rolesDe(session));
  }

  document.getElementById("porte-btn").addEventListener("click", async () => {
    const btn = document.getElementById("porte-btn");
    const email = document.getElementById("porte-email").value.trim();
    const mdp = document.getElementById("porte-mdp").value;
    taire();
    if(!email || !mdp){ dire("Entrez votre e-mail et votre mot de passe."); return; }
    btn.disabled = true; btn.textContent = "Vérification…";
    try{
      const r = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + PAIE.cleApi,
        { method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ email, password: mdp, returnSecureToken: true }) });
      const d = await r.json();
      if(!r.ok){
        const m = (d.error && d.error.message) || "";
        dire(m.indexOf("TOO_MANY") === 0
          ? "Trop de tentatives. Réessayez dans quelques minutes."
          : "E-mail ou mot de passe incorrect.");
        return;
      }
      const session = { idToken:d.idToken, refreshToken:d.refreshToken, uid:d.localId,
                        email:d.email, expire: Date.now() + (Number(d.expiresIn)-60)*1000 };
      if(!(await estAutorise(session.email, await rolesDe(session)))){
        dire("Ce compte n'a pas accès à la paie. Seuls le DG et le DGA sont autorisés.");
        return;
      }
      localStorage.setItem(CLE_SESSION, JSON.stringify(session));
      document.getElementById("porte-mdp").value = "";
      ouvrir();
    }catch(e){
      dire("Connexion impossible. Vérifiez le réseau et réessayez.");
    }finally{
      btn.disabled = false; btn.textContent = "Ouvrir le registre";
    }
  });

  document.getElementById("porte-mdp").addEventListener("keydown", e => {
    if(e.key === "Enter") document.getElementById("porte-btn").click();
  });

  /* Session déjà ouverte depuis le portail : on entre directement */
  (async function(){
    let s = null;
    try{ s = JSON.parse(localStorage.getItem(CLE_SESSION) || "null"); }catch(e){}
    if(await verifier(s)) ouvrir();
  })();
})();
